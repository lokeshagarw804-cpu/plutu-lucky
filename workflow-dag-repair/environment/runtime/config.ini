[scheduler]
max_parallelism = 8
default_weight = 1
time_unit_ms = 100
strategy = priority_first

[scheduler.constrained]
max_parallelism = 3
resource_cap = 12
preemption = false

[priorities]
levels = low,medium,high, critical
weight_low = 1
weight_medium = 2
weight_high = 4
weight_critical = 8

[execution]
status_on_complete = completed
propagate_to_dependents = true
track_ancestry = true

[output]
schedule_file = execution_schedule.json
audit_file = audit_trail.json
output_dir = /app/runtime/output
