[workflows]
source_dir = /app/runtime/data
output_dir = /app/runtime/output

[scheduling]
max_parallel_jobs = 8
time_slot_duration = 5
priority_levels = critical,high,medium,low

[scheduling.strict]
max_parallel_jobs = 3
time_slot_duration = 5
priority_levels = critical,high,medium,low

[resources]
resource_pools = cpu,memory,gpu, network
pool_limits = 100,256,4,1000
tracking_mode = peak
