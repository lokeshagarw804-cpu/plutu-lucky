category = "task_scheduling"
difficulty = "hard"
tags = ["dag-scheduling", "resource-tracking", "dependency-resolution", "priority-queue", "debugging"]

difficulty_explanation = "Four interacting defects across three modules require understanding DAG scheduling algorithms, config parsing subtleties, resource tracking semantics, and sort stability. Bugs span whitespace-sensitive string parsing, wrong config section selection, cumulative vs peak aggregation, and missing sort tiebreaker — none are obvious from surface inspection."
solution_explanation = "Fix tracker pool name parsing to strip whitespace, change scheduler to read from scheduling.strict config section, fix resource peak calculation from sum-across-slots to max-per-slot, and add workflow_id as third sort key in resolver for deterministic ordering."
verification_explanation = "Tests validate parallelism constraints, resource utilization bounds, network pool tracking, and deterministic job ordering. Tests use range assertions and structural checks that require all bugs to be fixed together for full passage."
expert_time_estimate_hours = 3.0

[task]
name = "workflow-dag-repair"
description = "Debug a workflow DAG execution engine with four interacting defects across dependency resolution, job scheduling, and resource tracking. Bugs involve config parsing subtleties, aggregation semantics, and sort stability — not simple typos."

[task.difficulty]
level = "hard"
reasoning = "Requires tracing data flow across multiple modules, understanding the difference between peak and cumulative resource tracking, recognizing whitespace issues in config parsing, and identifying that sort stability depends on a third tiebreaker field. Defects interact — fixing one changes outputs that downstream modules consume."

[task.runtime]
entrypoint = "python3 -m runtime.run_workflow"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the workflow engine then validates output via pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches all four defects and re-runs the system."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
