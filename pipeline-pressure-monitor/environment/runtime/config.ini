[pipeline]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
sample_interval = 0.5

[segments]
active_segments = seg_1,seg_2,seg_3,seg_4,seg_10
segment_lengths = 120.0,85.5,200.0,150.0,95.0

[gradient]
method = central_difference
delta_time = 0.5
window_size = 8
overlap = 4

[detection]
pressure_threshold = 2.5
min_duration_samples = 3
classify_events = true

[interpolation]
method = cubic
boundary = clamped
upsample_factor = 2
