[task]
name = "merkle-audit-repair"
description = "Debug a Merkle tree audit verification system with five interacting defects across hash computation, tree construction, proof generation, file ordering, and verification. Bugs involve cryptographic algorithm subtleties and cross-module consistency requirements."

