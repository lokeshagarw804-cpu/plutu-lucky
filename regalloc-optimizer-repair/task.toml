# PLUTU-LUCKY-CANARY
author_name = "Lokesh Agarwal"
author_email = "lokeshagarw804@gmail.com"
category = "compilers"
difficulty = "hard"
tags = ["compilers", "register-allocation", "graph-coloring", "instruction-scheduling", "debugging", "dataflow-analysis"]

difficulty_explanation = "Five bugs are hidden across eight modules (including three correct distractor modules). Bugs exploit PHI node liveness propagation semantics, spill weight formula inversion, pre-colored register set membership confusion, dependency type classification swap (anti vs flow), and off-by-one in the Briggs coalescing criterion. Each produces code that runs without errors but generates incorrect optimization metrics."
solution_explanation = "Fix 1: Only add PHI operand to live-out of its corresponding predecessor (not all predecessors). Fix 2: Use division (uses/degree) instead of multiplication for spill weight. Fix 3: Remove colored_set membership check, use only neighbor.color is not None. Fix 4: Swap defs/uses in anti-dependency detection to check i.uses & j.defs. Fix 5: Change > to >= in Briggs significant-degree threshold."
verification_explanation = "Tests validate 33 assertions covering registers used, spills inserted, moves coalesced, schedule stalls, interference edges, and coloring rounds for both programs, plus summary totals and structural completeness."
expert_time_estimate_hours = 5.0

[task]
name = "regalloc-optimizer-repair"
description = "Debug a register allocator and instruction scheduler for a custom bytecode VM. Five subtle bugs are hidden across eight modules implementing Chaitin-Briggs graph coloring, backward dataflow liveness analysis, move coalescing, and list scheduling. Three modules are correct distractors."

[task.difficulty]
level = "hard"
reasoning = "Requires understanding backward dataflow analysis with PHI nodes, graph coloring register allocation, the Briggs conservative coalescing criterion, pipeline scheduling with dependency classification, and spill cost heuristics. Bugs exploit subtle algorithmic details that produce valid-looking but incorrect results."

[task.runtime]
entrypoint = "python3 -m runtime.pipeline"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the register allocation pipeline then validates the optimization report via pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches all five defects and re-runs the pipeline."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
