[ledger]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
batch_size = 20

[accounts]
active_types = savings,checking,credit, merchant

[reconciliation]
balance_threshold = 500
min_consecutive_windows = 3
window_duration_seconds = 3600

[reconciliation.strict]
balance_threshold = 100
min_consecutive_windows = 2
window_duration_seconds = 3600
