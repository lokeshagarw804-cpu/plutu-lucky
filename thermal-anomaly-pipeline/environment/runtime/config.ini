[pipeline]
# Correlation window in seconds - events within this range may be related
correlation_window = 30

# Maximum alerts per batch
max_batch_size = 50

# Output format: json or summary
output_format = json

[thresholds]
# Default thresholds (overridden by per-zone values)
default_high = 85.0
default_critical = 95.0

[scoring]
# Enable weighted scoring
weighted_scoring = true
# Minimum score to include in alerts
min_alert_score = 25.0
