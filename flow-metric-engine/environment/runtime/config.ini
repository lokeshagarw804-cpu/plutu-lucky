[flows]
active = flow_alpha,flow_beta,flow_gamma,flow_delta
data_dir = /app/runtime/data

[classification]
boundaries = 200,800
categories = small,medium,large
window_size = 30
window_step = 1

[scoring]
category_weights = 0.2,0.5,0.3
latency_penalty = 1.5
violation_threshold = 0.42

[output]
output_dir = /app/runtime/output
