[trust_store]
trusted_roots = alpha_ca,beta_ca,gamma_ca, delta_ca
min_key_bits = 2048
allowed_algorithms = sha256,sha384,sha512

[validation]
max_chain_depth = 8
batch_size = 10
score_decay_factor = 0.15
require_strong_algo = true

[validation.strict]
max_chain_depth = 4
score_decay_factor = 0.10
require_strong_algo = true

[output]
report_path = /app/runtime/output/validation_report.json
summary_path = /app/runtime/output/chain_summary.json
include_untrusted = false
