[streams]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
active_aggregates = orders,inventory,	payments

[replay]
batch_size = 50
ordering = timestamp_seq
snapshot_mode = cumulative
compaction = false

[replay.checkpointing]
batch_size = 10
ordering = timestamp_stream_seq
snapshot_mode = final
compaction = true

[projection]
method = fold
conflict_resolution = last_write_wins
include_metadata = true

[retention]
max_events_per_stream = 200
compact_after = 100
