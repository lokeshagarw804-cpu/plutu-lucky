[task]
name = "particle-collision-repair"
version = "2.0"
description = "Debug a lattice signal propagation pipeline with subtle numerical and algorithmic errors"
difficulty = "hard"
tags = ["signal-processing", "debugging", "lattice-systems", "numerical-methods"]

[task.metadata]
language = "python"
min_python_version = "3.9"
dependencies = []
test_framework = "pytest"
estimated_time_minutes = 45
num_bugs = 3
files_with_bugs = ["runtime/propagation_core.py", "runtime/lattice_analysis.py"]
files_correct = ["runtime/trace_reader.py", "runtime/pipeline.py", "runtime/calibration.py", "runtime/synthesis_output.py"]

[task.difficulty_detail]
difficulty_explanation = "Requires understanding partial order incomparability vs statistical divergence metrics, recognizing that relay attenuation (signal loss) should actually be relay participation (signal gain), and identifying that external propagation score incorrectly excludes self-contribution from priority ranking."
solution_explanation = "Fix 1: Change -= 1 to += 1 in apply_relay (relay participation adds to own depth, not attenuates). Fix 2: Replace residual inner product test with incomparability check (not vector_leq in both directions). Fix 3: Sort by sum(depths[n]) instead of sum - self_component."
