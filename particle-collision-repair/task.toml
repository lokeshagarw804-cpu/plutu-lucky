[task]
name = "particle-collision-repair"
description = "Debug a lattice signal propagation system that tracks depth vectors across 7 sensor nodes. The system processes signal events, computes isolation between propagation paths, and generates priority-ordered synthesis reports."

[task.difficulty]
level = "hard"
reasoning = "Three interacting bugs span the propagation core and analysis modules. Bug 1 is masked by a convincing deferred-computation pattern. Bug 2 requires constructing incomparability logic from only leq/geq primitives. Bug 3 uses both available parameters in a plausible but incorrect metric."

[task.runtime]
entrypoint = "python3 /app/runtime/pipeline.py"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs 14 pytest tests across 4 tiers verifying structure, depth values, isolation classification, and digest."

[task.repair]
command = "bash solution/solve.sh"
description = "Applies fixes to propagation_core.py and lattice_analysis.py, then regenerates outputs."

