[registry]
sources = registry_core,registry_plugins,registry_tooling
root_packages = framework,auth-plugin,lint-checker

[scopes]
excluded_scopes = dev,test, peer
include_transitives = true

[resolution]
strategy = highest_compatible
max_depth = 12
conflict_mode = fail_fast

[resolution.strict]
strategy = highest_compatible
max_depth = 5
conflict_mode = fail_fast

[version]
match_mode = minimum_satisfying
pre_release = false

[manifest]
output_path = /app/runtime/output/resolution_manifest.json
graph_path = /app/runtime/output/dependency_graph.json
summary_path = /app/runtime/output/resolve_summary.json
include_checksum = true
checksum_fields = package,version,scope,depth
