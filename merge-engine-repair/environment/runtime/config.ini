[branches]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
active_strategies = recursive,ours,theirs, patience

[merge]
max_depth = 50
chunk_size = 4
conflict_mode = strict

[merge.resolution]
max_depth = 50
chunk_size = 4
similarity_threshold = 60

[resolution]
similarity_threshold = 80
auto_resolve = true
prefer_recent = true

[output]
format = json
include_ancestry = true
