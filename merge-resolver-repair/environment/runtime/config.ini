[merge]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
conflict_threshold = 50
max_hunk_size = 200

[merge.strict]
conflict_threshold = 15
max_hunk_size = 100

[merge.experimental]
conflict_threshold = 25
use_adaptive = false

[strategies]
merge_strategies = recursive,patience,histogram, minimal
default_strategy = recursive
fallback_strategy = patience

[strategies.weights]
recursive = 1.0
patience = 0.9
histogram = 0.85
minimal = 0.7

[resolution]
auto_resolve = true
prefer_left_on_tie = false
context_lines = 3
