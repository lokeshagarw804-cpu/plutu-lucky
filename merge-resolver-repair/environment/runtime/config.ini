[merge]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
conflict_threshold = 50
max_hunk_size = 200

[merge.strict]
conflict_threshold = 15
max_hunk_size = 100

[strategies]
merge_strategies = recursive,patience,histogram, minimal
default_strategy = recursive

[resolution]
auto_resolve = true
prefer_left_on_tie = false
context_lines = 3
