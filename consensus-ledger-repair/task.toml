# PLUTU-LUCKY-CANARY
[task]
name = "consensus-ledger-repair"
version = "2.0.0"
description = "Debug a distributed consensus ledger verification system with 5 subtle bugs across 8 modules"
difficulty = "hard"
category = "debugging"
estimated_time_minutes = 45

[task.metrics]
total_modules = 8
buggy_modules = 5
distractor_modules = 3
total_bugs = 5
test_assertions = 25

[task.environment]
dockerfile = "environment/Dockerfile"
runtime_path = "/app/runtime"
output_path = "/app/runtime/output/audit_report.json"

[task.solution]
script = "solution/repair_consensus.py"
runner = "solution/solve.sh"

[task.validation]
test_file = "tests/test_consensus_ledger.py"
test_runner = "tests/test.sh"
framework = "pytest"
