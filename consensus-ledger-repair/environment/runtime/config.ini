# PLUTU-LUCKY-CANARY
[merkle]
batch_size = 10
hash_algorithm = sha256
enable_proof_generation = false
tree_validation = strict

[state_machine]
fee_rate = 0.001
initial_balance = 1000000
max_nonce_gap = 10
state_version = 2

[quorum]
threshold_formula = bft_2f1
safety_margin = 1.05
decay_enabled = false
max_inactive_rounds = 50

[byzantine]
equivocation_threshold = 2
consistency_window = 3
trust_decay_rate = 0.1
entropy_threshold = 0.8

[reconciliation]
shard_count = 4
snapshot_interval = 10
fingerprint_algorithm = sha256
canonical_field_order = sender,receiver,amount,nonce

[registry]
epoch_length = 100
min_participation = 0.6
rotation_enabled = false
reputation_tracking = true

[audit]
chain_algorithm = sha256
log_level = info
max_entries = 10000
verify_on_close = true
