[rebase]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
max_commits = 500

[detection]
overlap_threshold = 5
max_file_distance = 10

[detection.strict]
overlap_threshold = 2
max_file_distance = 5

[detection.experimental]
overlap_threshold = 1
use_fuzzy = true

[patches]
skip_patterns = test_,mock_,fixture_, setup_
default_priority = 50
fallback_strategy = sequential

[ordering]
method = topological
break_ties_by = timestamp
deterministic = true
