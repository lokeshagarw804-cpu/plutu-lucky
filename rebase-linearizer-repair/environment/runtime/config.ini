[rebase]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
max_commits = 500

[detection]
overlap_threshold = 5
max_file_distance = 10
method = exact

[detection.strict]
overlap_threshold = 2
max_file_distance = 5

[detection.fuzzy]
overlap_threshold = 1
similarity_min = 0.8

[detection.experimental]
overlap_threshold = 1
use_fuzzy = true

[patches]
skip_patterns = test_,mock_,fixture_, setup_
default_priority = 50
fallback_strategy = sequential

[patches.extended]
skip_patterns = test_,mock_,fixture_,setup_,vendor_,generated_
include_reverts = false

[ordering]
method = topological
break_ties_by = timestamp
deterministic = true

[scoring]
method = aggregate
normalize = false
