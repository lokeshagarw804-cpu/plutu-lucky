[queues]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
active_workers = compute,io,network, gpu

[scheduling]
batch_capacity = 50
max_concurrent = 8
deadline_window = 10
priority_method = weighted

[scheduling.precise]
batch_capacity = 12
max_concurrent = 4
deadline_window = 10

[priorities]
weight_urgency = 0.4
weight_resource = 0.3
weight_age = 0.3

[reporting]
include_idle = true
format = json
