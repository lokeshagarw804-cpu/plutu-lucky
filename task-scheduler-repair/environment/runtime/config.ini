[queues]
priority_queues = critical,standard,batch, deferred
capacity_limit = 50
enable_preemption = false

[scheduling]
aging_factor = 0.25
deadline_weight = 1.5
dependency_boost = 10
max_rounds = 3

[scheduling.weighted]
aging_factor = 0.08
deadline_weight = 1.5
dependency_boost = 10
max_rounds = 3

[execution]
output_path = /app/runtime/output/execution_plan.json
schedule_path = /app/runtime/output/schedule_matrix.json
summary_path = /app/runtime/output/scheduler_summary.json
time_quantum_minutes = 30
