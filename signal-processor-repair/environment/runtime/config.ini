[stations]
calibrated_ids = alpha,beta,gamma, delta
min_quality = 0.90
channels = pressure,temperature

[calibration]
mode = offset
alpha_offset = 0.35
beta_offset = 0.22
gamma_offset = 0.18
delta_offset = 0.41

[detection]
noise_threshold = 0.50
window_size = 4
overlap_ratio = 0.5
min_readings_per_window = 3

[detection.refined]
noise_threshold = 0.15
window_size = 4
overlap_ratio = 0.5
min_readings_per_window = 3

[correlation]
method = pearson
min_pair_readings = 3
significance_level = 0.05

[output]
anomaly_path = /app/runtime/output/anomaly_report.json
correlation_path = /app/runtime/output/correlation_matrix.json
summary_path = /app/runtime/output/processing_summary.json
