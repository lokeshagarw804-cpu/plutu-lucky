[sources]
data_dir = /app/runtime/data
output_dir = /app/runtime/output
active_layers = terrain,infrastructure,hydrology, vegetation

[grid]
resolution = 100
origin_x = 0.0
origin_y = 0.0
extent_x = 1000.0
extent_y = 1000.0

[grid.analysis]
resolution = 25
cell_size = 40.0

[density]
kernel_radius = 80.0
normalization = weighted_linear
passes = 3

[clustering]
min_points = 3
distance_threshold = 120.0
