author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "spatial_indexing"
difficulty = "hard"
tags = ["spatial-indexing", "geospatial", "kernel-density", "grid-computing", "debugging"]

difficulty_explanation = "Four interacting defects require understanding spatial coordinate geometry, grid cell boundary semantics, kernel density function mathematics (linear vs quadratic distance weighting), and how point processing order creates cascade effects in incremental centroid-based clustering. The resolution bug requires TWO code changes (section AND derivation formula), and the density bug requires understanding kernel function theory to identify that quadratic weights are being used where linear weights are specified."
solution_explanation = "Fix whitespace in comma-split layer list, change grid resolution source to grid.analysis section AND replace derived cell_size with config-read value, add boundary detection for exact cell multiples in _get_cell, replace quadratic kernel (1-dist^2/r^2) with linear kernel (1-dist/r) in density calculator, and add layer_id as sort tiebreaker for deterministic processing order."
verification_explanation = "Tests validate total points (all layers loaded), grid resolution and cell size (correct config section), occupied cell count (depends on resolution AND boundary handling), specific boundary point assignment (t011 must be in cell 9,9), density value ranges (distinguishes linear from quadratic kernel), cluster count (depends on vegetation loading AND sort order), and specific cluster membership (proves vegetation points are critical for cluster viability)."
expert_time_estimate_hours = 4.0

[task]
name = "spatial-grid-repair"
description = "Debug a spatial grid indexer with four deeply interacting defects: a config parsing issue that drops a critical data layer, a dual-source grid configuration error, a quadratic-vs-linear kernel density function bug, and a sort ordering issue that cascades through incremental cluster centroid computation."

[task.difficulty]
level = "hard"
reasoning = "Requires understanding kernel density estimation theory (linear vs quadratic distance weighting produces different decay curves), grid cell boundary arithmetic (points at exact multiples need special handling), and how incremental centroid drift in clustering means point order affects final cluster membership non-locally. The grid bug is a trap: fixing just the config section leaves cell_size still wrong because it is derived rather than read."

[task.runtime]
entrypoint = "python3 -m runtime.run_spatial"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the spatial indexer then validates output via pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches all defects and re-runs the system."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
