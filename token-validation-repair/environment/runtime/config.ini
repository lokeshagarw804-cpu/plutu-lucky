[tokens]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
key_encoding = base64
signing_key = c2VjcmV0X2tleV9mb3JfaG1hY19zaWduaW5n

[policy]
max_clock_drift_sec = 300
allowed_issuers = auth-primary,auth-backup,auth-legacy
min_scope_match = 1

[policy.strict]
max_clock_drift_sec = 60
min_scope_match = 1

[scoring]
base_score = 100
decay_factor = 0.85
root_issuer = auth-primary

[ordering]
sort_field = token_id
direction = ascending
