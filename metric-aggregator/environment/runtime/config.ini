[services]
source_dir = /app/runtime
output_dir = /app/runtime/output
active_nodes = service_api,service_worker,service_gateway,service_cache

[aggregation]
window_size = 6
step_size = 3
method = weighted_mean

[ranking]
# Node to exclude from percentile ranking (infrastructure nodes)
exclude_node = service_gateway
weights_latency = 0.4
weights_error = 0.35
weights_throughput = 0.25

[detection]
degradation_threshold = 0.65
min_consecutive_windows = 2
