[ledger]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
integrity_key = cXVvdGFfbGVkZ2VyX2htYWNfc2VjcmV0X2tleQ==
key_encoding = base64

[limits]
max_allocation_units = 5000
max_burst_factor = 3.0
allowed_tiers = gold,silver,bronze

[limits.strict]
max_allocation_units = 2000
max_burst_factor = 1.5

[scoring]
base_priority = 100
decay_factor = 0.80
root_team = platform-core

[report]
sort_field = request_id
direction = ascending
