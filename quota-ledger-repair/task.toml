tags = ["quota-management", "resource-allocation", "integrity-verification", "policy-engine", "debugging"]
difficulty_explanation = "Requires understanding base64 key encoding for HMAC verification, config section resolution semantics, numeric vs lexicographic file ordering, and exponential priority decay formulas. Multiple interacting bugs where fixing one alone does not resolve test failures."
solution_explanation = "Four bugs: quota_validator reads from limits section instead of limits.strict for 2000 unit cap, integrity_checker must base64-decode the signing key, ledger_loader must sort files numerically not lexicographically, priority_scorer uses distance+1 instead of distance in decay exponent."
verification_explanation = "12 graduated pytest tests verify structural correctness, request counts, integrity validation, quota enforcement with strict limits, priority score accuracy, and batch processing order."
expert_time_estimate_hours = 3.0

[task]
name = "quota-ledger-repair"
description = "Debug a resource quota allocation system with four interacting defects across integrity verification, quota policy enforcement, priority scoring, and batch processing order."

[task.difficulty]
level = "hard"
reasoning = "Requires understanding base64 encoding semantics, configparser section resolution, numeric vs lexicographic sorting, and exponential decay formulas. Defects interact — the integrity check must be fixed before quota enforcement can be validated."

[task.runtime]
entrypoint = "python3 -m runtime.run_allocator"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the allocation system then validates output via pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches all four defects and re-runs the system."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
