[task]
name = "armada-clash-repair"
description = "Debug a naval fleet engagement simulation where 7 armadas track operational vectors to determine autonomy and deployment priority. Four interconnected bugs in the vector synchronization, autonomy analysis, and priority computation produce incorrect tactical assessments."

[task.difficulty]
level = "hard"
reasoning = "Requires understanding vector clock semantics in a game context, recognizing that bidirectional containment is not the same as incomparability, and identifying that temporal recency is not equivalent to logical weight. Misleading docstrings actively defend each bug as intentional."

[task.runtime]
entrypoint = "python3 /app/runtime/orchestrator.py"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs 14 pytest tests in 4 tiers validating engagement vectors, autonomy pairs, deployment ordering, and digest integrity."

[task.repair]
command = "bash solution/solve.sh"
description = "Fixes vector_engine.py, clash_analyzer.py and regenerates armada_report.json with corrected outputs."

