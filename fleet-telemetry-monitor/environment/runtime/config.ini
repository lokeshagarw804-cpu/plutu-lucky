[fleet]
data_dir = /app/runtime/data
output_dir = /app/runtime/output
vehicles = truck_1,truck_2,truck_3,truck_12,truck_7

[anomaly]
window_size = 8
overlap = 4
speed_threshold = 95.0
temp_ceiling = 210.0
fuel_drop_rate = 4.5

[scoring]
weights = 0.4,0.35,0.25
severity_cap = 1.0
min_consecutive = 2

[report]
sort_by = severity
group_by = vehicle
