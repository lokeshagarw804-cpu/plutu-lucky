[streams]
active_sources = orders,payments,inventory
event_types = order_placed,order_confirmed,order_shipped,payment_initiated,payment_completed,payment_refunded,stock_reserved,stock_released, stock_adjusted

[replay]
batch_window_hours = 48
max_events_per_batch = 500
enable_deduplication = true
snapshot_mode = latest

[replay.streaming]
batch_window_hours = 24
max_events_per_batch = 100
enable_deduplication = true
snapshot_mode = latest

[projections]
output_path = /app/runtime/output/projections.json
event_log_path = /app/runtime/output/event_log.json
include_metadata = true
track_entity_state = true

[output]
summary_path = /app/runtime/output/replay_summary.json
format = json
pretty_print = true
