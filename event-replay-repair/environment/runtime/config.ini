[sources]
# Allowed event sources for materialization
event_streams = orders,payments, refunds

[projection]
batch_size = 100
snapshot_mode = cumulative

[projection.incremental]
batch_size = 25
snapshot_mode = latest

[correlation]
# Events are merged by timestamp ordering
merge_strategy = temporal
dedup_window_sec = 5

[output]
directory = /app/runtime/output
summary_file = aggregate_summary.json
timeline_file = event_timeline.json
