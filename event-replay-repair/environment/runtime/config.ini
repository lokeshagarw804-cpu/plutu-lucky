[streams]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
included_streams = orders,payments,adjustments, refunds

[projection]
initial_balance = 0
decimal_places = 4
currency = USD

[projection.reconciliation]
decimal_places = 2
tolerance = 0.01

[snapshots]
interval_events = 10
checkpoint_format = cumulative

[sequencing]
ordering = timestamp_first
tie_resolution = sequence
