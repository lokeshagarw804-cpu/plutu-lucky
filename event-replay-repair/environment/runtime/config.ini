[streams]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
active_streams = stream_orders,stream_payments,stream_inventory, stream_fulfillment

[replay]
batch_size = 100
ordering = timestamp_seq
dedup_window_ms = 50

[replay.incremental]
batch_size = 25
checkpoint_interval = 10
flush_on_boundary = true

[projection]
target_fields = order_total,payment_amount,quantity,fulfillment_status
aggregation_mode = snapshot

[snapshot]
format = json
include_metadata = true
version_prefix = v1
