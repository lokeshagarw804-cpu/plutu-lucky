difficulty_explanation = "Task requires identifying four interacting defects across loader, projector, and correlator modules. Bugs involve config parsing subtleties, wrong section references, accumulation semantics, and sort tiebreakers that only manifest with specific cross-stream data patterns."
solution_explanation = "Fix config split to strip whitespace (loader), read correct config section for batch size (projector), change accumulation to last-write-wins (projector), and add stream_id to sort key (correlator). All four fixes needed for correct aggregate output."
verification_explanation = "Tests validate output file structure, stream inclusion, financial calculations, and deterministic event ordering. Graduated difficulty ensures partial fixes are distinguishable from complete repair."
