[task]
name = "event-replay-repair"
description = "Debug a broken event replay materialization system that reads order, payment, and refund event streams, correlates them into a unified timeline, projects aggregate state, and writes summary reports. Four subtle defects produce incorrect output."

[task.difficulty]
level = "hard"
reasoning = "Requires cross-file reasoning between config, loader, projector, and correlator. Bugs interact: fixing one reveals symptoms of others. Config section misdirection and whitespace parsing require careful reading of multiple files simultaneously."

[task.runtime]
entrypoint = "python3 -m runtime.run_replay"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the materialization system then executes pytest to verify output correctness."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches four defects in loader, projector, and correlator modules, then re-runs the system."

