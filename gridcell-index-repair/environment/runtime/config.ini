[grid]
cell_size = 1.0
origin_lat = 0.0
origin_lon = 0.0
grid_rows = 10
grid_cols = 10

[aggregation]
min_readings_per_cell = 2
variance_mode = sample

[clustering]
density_threshold = 3
connectivity = 8
min_cluster_size = 2

[query]
center_lat = 1.0
center_lon = 1.0
radius = 3.0
max_results = 20

[output]
index_path = /app/runtime/output/grid_index.json
clusters_path = /app/runtime/output/cluster_report.json
query_path = /app/runtime/output/query_results.json
summary_path = /app/runtime/output/spatial_summary.json
