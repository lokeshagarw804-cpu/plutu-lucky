solution_explanation = "Fix whitespace handling in comma-split aggregate type list, read snapshot_interval from the correct config section (projection.materialized), replace cumulative running counters with per-interval independent state in projection snapshots, add aggregate_id as sort tiebreaker for deterministic event replay ordering, and correct dedup window boundary from window+1 to window."
verification_explanation = "Tests validate aggregate count and event totals (all types loaded), snapshot interval (correct config section), per-interval snapshot independence, per-aggregate event counts including shipping, and replay ordering determinism at shared timestamps. Tests use exact count assertions and interval sum checks making it impossible to pass without fixing all bugs."
