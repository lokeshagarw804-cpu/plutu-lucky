[aggregates]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
active_types = order,inventory,customer, shipping

[projection]
snapshot_interval = 100
replay_mode = sequential
dedup_window = 5

[projection.materialized]
snapshot_interval = 10
replay_mode = sequential

[views]
include_metadata = true
format = json
compaction_threshold = 50
