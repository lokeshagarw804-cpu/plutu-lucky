[streams]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
active_streams = access,payment,security, admin

[verification]
hash_algorithm = sha256
window_size = 50
chain_mode = strict

[verification.hmac]
key_length = 32
digest_bytes = 16

[hmac]
key_length = 64
digest_bytes = 32

[reporting]
include_valid = true
format = json
tamper_threshold = 0.1
