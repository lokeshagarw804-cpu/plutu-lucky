[pipeline]
mode = production
precision = 3
window_size = 3
confidence_threshold = 0.65
max_drift_tolerance = 0.5

[clusters]
order = alpha,beta,gamma,delta,epsilon
regions = north,south,east,west,central

[scoring]
thermal_weight = 0.35
pressure_weight = 0.25
humidity_weight = 0.20
vibration_weight = 0.20
cross_ref_bonus = 0.05
decay_factor = 0.92

[output]
format = matrix
include_metadata = true
decimal_places = 3
