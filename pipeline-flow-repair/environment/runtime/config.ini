[pipeline]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
fluid_viscosity = 0.05
fluid_density = 998.2

[segments]
active_segments = seg_1,seg_2,seg_3,seg_10,seg_11
upstream_order = seg_1,seg_2,seg_3,seg_10,seg_11

[pressure]
method = hagen_poiseuille
roughness_factor = 1.0

[anomaly]
pressure_threshold = 0.15
flow_deviation_threshold = 0.12
min_consecutive_readings = 3

[classification]
leak_drop_rate = 8.0
blockage_drop_rate = 18.0
severity_weights = 0.4,0.35,0.25
