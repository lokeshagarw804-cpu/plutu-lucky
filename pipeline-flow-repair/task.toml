version = "1.0"

[metadata]
author_name = "Lokesh Agarwal"
author_email = "lokeshagarw804@gmail.com"
category = "fluid_dynamics"
difficulty = "hard"
tags = ["pipeline-monitoring", "pressure-analysis", "anomaly-detection", "debugging", "numerical-computing"]
expert_time_estimate_min = 180
junior_time_estimate_min = 360

[task]
name = "parsewave/pipeline-flow-repair"

[environment]
dockerfile = "environment/Dockerfile"
entrypoint = "python3 -m runtime.main"
language = "python"
dependencies = "stdlib-only"

[verifier]
command = "bash tests/test.sh"
description = "Runs the pipeline monitor then validates output via pytest."

[agent]
timeout_sec = 900
