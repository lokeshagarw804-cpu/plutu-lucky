[pipeline]
output_dir = /app/runtime/output
data_dir = /app/runtime/data

[ewma]
alpha = 0.3
warmup_periods = 3

[windows]
window_size = 15
min_readings = 2

[scoring]
z_threshold_warning = 1.5
z_threshold_critical = 2.5
z_threshold_emergency = 3.5

[sensors]
active = engine_temp,fuel_pressure,rpm
weight_engine_temp = 0.5
weight_fuel_pressure = 0.3
weight_rpm = 0.2

[vehicles]
fleet = V200,V201,V202,V203
