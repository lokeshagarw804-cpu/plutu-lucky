[meters]
active_meters = meter_3,meter_7,meter_12,meter_1,meter_20
data_dir = /app/runtime/data
output_dir = /app/runtime/output

[calibration]
; polynomial coefficients for voltage-to-flow conversion
; format: a0 + a1*x + a2*x^2 + a3*x^3
; coefficients listed low-order to high-order: a0,a1,a2,a3
coefficients = 0.15,2.37,-0.041,0.0008
reference_voltage = 2.5

[compensation]
; linear temperature compensation factor per degree offset
; flow_compensated = flow_raw * (1 + factor * (temp - reference_temp))
factor = 0.0023
reference_temp = 20.0

[aggregation]
; interval length in seconds for grouping readings
interval_seconds = 60
; method: mean, median
method = mean

[compliance]
; flow rate limits in liters/min
min_flow = 1.5
max_flow = 10.0
; maximum allowed deviation between compensated readings in same interval
max_deviation = 2.5
