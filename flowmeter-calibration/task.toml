version = "1.0"

[metadata]
author_name = "Lokesh Agarwal"
author_email = "lokeshagarw804@gmail.com"
category = "data_processing"
difficulty = "hard"
tags = ["calibration", "polynomial", "temperature-compensation", "data-pipeline", "debugging"]
expert_time_estimate_min = 180
junior_time_estimate_min = 360

[task]
name = "flowmeter-calibration"
description = "Debug a flow meter calibration pipeline with five interacting defects across polynomial evaluation, voltage normalization, temperature compensation, interval aggregation, and compliance reporting."

[verifier]
command = "bash tests/test.sh"
description = "Runs the calibration pipeline then validates output via pytest."

[environment]
dockerfile = "environment/Dockerfile"
entrypoint = "python3 -m runtime.main"

[agent]
timeout_sec = 900
