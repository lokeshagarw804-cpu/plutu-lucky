category = "data_processing"
difficulty = "hard"
tags = ["calibration", "polynomial", "temperature-compensation", "data-pipeline", "debugging"]

difficulty_explanation = "Five interacting bugs across four modules require understanding polynomial evaluation coefficient ordering (Horner's method), spurious voltage normalization that looks intentional, temperature offset-vs-absolute semantics, interval boundary inclusion rules, and the distinction between raw vs compensated flow in compliance checks plus lexicographic vs numeric sorting. Partial fixes produce plausible but incorrect output because bugs interact nonlinearly."
solution_explanation = "Fix Horner iteration to use reversed coefficients, remove spurious voltage normalization, change temperature compensation to use offset from reference, remove boundary subtraction in aggregator, and switch compliance check from raw to compensated flow while fixing meter sort order."
verification_explanation = "Tests verify meter ordering, compliance counts, specific violation intervals for meter_20, reading counts, and interval totals. Values are deterministically derived from input data and correct algorithm but require all five fixes to produce the expected combination of results."
expert_time_estimate_hours = 3.0

[task]
name = "flowmeter-calibration"
description = "Debug a flow meter calibration pipeline with five interacting defects across polynomial evaluation, voltage normalization, temperature compensation, interval aggregation, and compliance reporting."

[task.difficulty]
level = "hard"
reasoning = "Requires understanding Horner's method coefficient ordering, recognizing that voltage normalization is spurious despite looking intentional, distinguishing absolute temperature from offset-from-reference in compensation, understanding interval boundary half-open semantics, and knowing which flow value (raw vs compensated) is appropriate for compliance. Bugs interact so any partial fix still produces wrong output."

[task.runtime]
entrypoint = "python3 -m runtime.main"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the calibration pipeline then validates output via pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches all five defects and re-runs the system."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"

[agent]
timeout_sec = 900
