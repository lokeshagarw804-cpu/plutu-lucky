[network]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
max_rounds = 50

[consensus.preconfirm]
quorum_threshold = 0.80
confirmation_depth = 3
max_parents = 4

[consensus.final]
quorum_threshold = 0.67
confirmation_depth = 2

[validators]
active_validators = validator_1,validator_2,validator_3, validator_4

[scoring]
base_weight = 1.0
stake_multiplier = 100
decay_factor = 0.95
