[queues]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
active_queues = batch,interactive,realtime, maintenance

[scheduler]
time_quantum_ms = 100
max_rounds = 10
preemptive = true
algorithm = priority_deadline
validation_tolerance_ms = 500

[scheduler.validation]
validation_tolerance_ms = 100
starvation_threshold = 3
aging_boost = 1

[deadlines]
miss_penalty = 50
grace_window_ms = 200
escalation_factor = 2.0
