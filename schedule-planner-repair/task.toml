author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "task_scheduling"
difficulty = "hard"
tags = ["scheduler", "priority-queue", "deadline-management", "round-robin", "debugging"]

difficulty_explanation = "Four interacting defects across five modules require understanding preemptive scheduling semantics, configuration parsing subtleties, progress tracking state management, and deterministic ordering with multi-key sort. Bugs cannot be identified from output alone — they require tracing data flow across queue loading, priority sorting, execution, and validation stages."
solution_explanation = "Fix queue loader to strip whitespace from comma-split config values, fix plan validator to read tolerance from the correct config section, fix deadline checker to record point-in-time progress instead of accumulating across snapshots, and fix priority sorter to include queue_id in sort key for deterministic cross-queue ordering."
verification_explanation = "Tests validate queue loading completeness, job count, execution completion counts, snapshot checkpoint counts and value ranges, and validation status. Tests use graduated difficulty with structural checks passing even with buggy code, while completion accuracy and validation tests require all bugs to be fixed."
expert_time_estimate_hours = 3.0

[task]
name = "schedule-planner-repair"
description = "Debug a preemptive priority scheduling engine with four interacting defects across queue loading, job sorting, progress tracking, and plan validation. Bugs involve configuration parsing, accumulation semantics, and multi-key sort ordering subtleties."

[task.difficulty]
level = "hard"
reasoning = "Requires understanding priority scheduling semantics, configparser section naming conventions, defaultdict accumulation patterns, and multi-key sorting for deterministic ordering. Defects interact — fixing one changes outputs that other modules depend on for correct behavior."

[task.runtime]
entrypoint = "python3 -m runtime.run_scheduler"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the scheduling engine then validates output via pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches all four defects and re-runs the system."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
