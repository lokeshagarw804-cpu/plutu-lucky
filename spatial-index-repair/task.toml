difficulty_explanation = "Five interacting defects across six modules require understanding signal processing math, timestamp alignment arithmetic, sorting edge cases, and the relationship between normalization and correlation computation. Bugs cannot be identified from the instruction document alone — they require tracing data flow and understanding mathematical properties."
solution_explanation = "Fix window step off-by-one in correlator, replace double-normalization with dot product for pre-normalized signals, use round() instead of int() for fractional sample alignment, sort stations by numeric suffix rather than lexicographic string comparison, and add abs() to threshold comparison for bidirectional event detection with proper type classification."
verification_explanation = "Tests validate station ordering, correlation value ranges, matrix symmetry, event detection counts and types. Tests use range assertions rather than exact values to avoid trivially leaking the solution while still requiring all bugs to be fixed for passage."
expert_time_estimate_hours = 3.5

[task]
name = "spatial-index-repair"
description = "Debug a signal correlation engine with five interacting defects across windowed correlation computation, signal alignment, station ordering, normalization handling, and event detection. Bugs involve numerical computing subtleties, not simple configuration errors."

[task.difficulty]
level = "hard"
reasoning = "Requires understanding mathematical properties of z-score normalization and correlation, floating-point alignment arithmetic, string vs numeric sorting, and bidirectional threshold detection. Defects interact — fixing one changes outputs that other modules depend on."

[task.runtime]
entrypoint = "python3 -m runtime.run_spatial"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the correlation engine then validates output via pytest."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches all five defects and re-runs the system."

