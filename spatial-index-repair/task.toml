category = "spatial_indexing"
difficulty = "hard"
tags = ["spatial-indexing", "r-tree", "config-parsing", "data-processing", "debugging"]

difficulty_explanation = "Requires identifying five interacting defects spread across six source files: a whitespace-sensitive filter in the normalizer (not the loader), wrong config section references in two modules with multiple decoy sections, a cross-module accumulation bug in the partition merger, a sort key omission in a separate ordering utility, and a subtle boundary comparison operator error in the query logic."
solution_explanation = "Fix normalizer to strip category tokens, change indexer and stats config reads from [spatial.engine] to [spatial.engine.leafnode], replace partition merger accumulation with last-write-wins, add feed_id to sort key in record_ordering.py, and change strict < to <= for lon_max boundary in indexer query_region."
verification_explanation = "Tests validate exact numeric output values without diagnostic hints. Graduated difficulty ensures structural tests pass with buggy code while value-dependent tests require multiple interacting fixes."
expert_time_estimate_hours = 3.0

[task]
name = "spatial-index-repair"
description = "Debug a spatial R-tree index builder with five interacting defects spread across six modules. Bugs involve config section misdirection with decoy values, whitespace-sensitive filtering in a non-obvious module, cross-file accumulation semantics, sort key completeness in a utility module, and a boundary comparison operator error."

[task.difficulty]
level = "hard"
reasoning = "Five bugs spread across six files with decoy config sections, cross-module interactions, and misdirecting source comments. Individual bugs are not independently identifiable without understanding the full data flow and comparing expected vs actual output values."

[task.runtime]
entrypoint = "python3 -m runtime.run_spatial"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the spatial index system then executes pytest to validate output correctness."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches all five defects across the runtime modules and re-runs the system."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
