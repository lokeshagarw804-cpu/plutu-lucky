author_name = "Dhruvkumar Patel"
author_email = "dhruvpatel2284@gmail.com"
category = "spatial_indexing"
difficulty = "hard"
tags = ["spatial-indexing", "r-tree", "config-parsing", "data-processing", "debugging"]

difficulty_explanation = "Requires identifying four interacting defects across multiple modules: a whitespace-sensitive config parser bug, a wrong config section reference duplicated in two files, a partition accumulation logic error, and a non-obvious sort key omission affecting determinism at timestamp ties."
solution_explanation = "Fix category filter to strip whitespace after comma-split, change config section reads from [indexer] to [indexer.rtree] in both indexer.py and stats.py, replace partition count accumulation with last-write-wins assignment, and add feed_id to the sort key between timestamp and seq for deterministic cross-stream ordering."
verification_explanation = "Tests validate output file existence and structure (easy), category inclusion and index node count (medium), and partition snapshot semantics with deterministic sort ordering at timestamp boundaries (hard). The graduated difficulty ensures partial fixes produce partial test passage."
expert_time_estimate_hours = 3.0

[task]
name = "spatial-index-repair"
description = "Debug a spatial R-tree index builder that ingests POI records from multiple feeds, filtering by category, building leaf nodes with configurable parameters, and computing partition-based statistics. Four interacting defects produce incorrect category filtering, wrong index structure, inflated statistics, and non-deterministic ordering."

[task.difficulty]
level = "hard"
reasoning = "The task requires understanding config section hierarchy, whitespace-sensitive string parsing, snapshot vs accumulation semantics, and sort key completeness across multiple interacting modules. Bugs are spread across 3 source files and interact in ways that make isolated fixes insufficient."

[task.runtime]
entrypoint = "python3 -m runtime.run_spatial"
language = "python"
dependencies = "stdlib-only"

[task.validator]
command = "bash tests/test.sh"
description = "Runs the spatial index system then executes pytest to validate output correctness including category filtering, index structure, statistics computation, and sort determinism."

[task.repair]
command = "bash solution/solve.sh"
description = "Patches feed_loader.py (whitespace strip), indexer.py (config section and sort key), and stats.py (config section and accumulation logic), then re-runs the system."

[task.resources]
timeout = 300
cpu = 2
memory = "2GB"
disk = "1GB"
