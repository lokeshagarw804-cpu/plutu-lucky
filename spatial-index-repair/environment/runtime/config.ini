[feeds]
source_dir = /app/runtime/data
output_dir = /app/runtime/output
allowed_categories = restaurant,park,museum, hospital

[spatial]
# Global spatial engine defaults — do not use directly for leaf operations.
# These are base values inherited by sub-sections unless overridden.
coordinate_system = wgs84
precision = 6

[spatial.engine]
# Engine-level parameters for the spatial indexing process.
# Controls batch ingestion and general node capacity.
batch_size = 100
max_entries_per_node = 50
algorithm = quadratic
split_strategy = linear

[spatial.engine.internal]
# Internal node parameters for intermediate tree levels.
# Not used for leaf-level indexing of POI records.
batch_size = 40
max_entries_per_node = 25
algorithm = greene-split

[spatial.engine.leafnode]
# R-tree leaf node configuration for POI record storage.
# see documentation: leaf nodes use smaller capacity for query efficiency.
batch_size = 20
max_entries_per_node = 8
algorithm = quadratic-split

[queries]
# Region query uses inclusive boundary matching for all four edges.
region_lat_min = 40.0
region_lat_max = 41.0
region_lon_min = -74.5
region_lon_max = -73.5
